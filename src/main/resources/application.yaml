server:
  port: 8880

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://localhost:8881
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            - id: order-service
              uri: http://localhost:8882
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1

management:
  endpoints:
    web:
      exposure:
        include: health,info